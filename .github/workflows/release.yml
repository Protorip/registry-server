name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to release, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    if: github.repository == 'Protorip/registry-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        name: Match the requested version and tag the release commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ || "$RELEASE_VERSION" != "$VERSION" ]]; then
            echo "Expected stable package version $VERSION."
            exit 1
          fi
          if ! grep -Fxq "## $VERSION" CHANGELOG.md; then
            echo "Missing changelog entry for $VERSION."
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
            exit 1
          fi
          TAG_REF=$(git ls-remote --refs origin "refs/tags/$TAG")
          if [[ -n "$TAG_REF" && "${TAG_REF%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "Tag $TAG already points to another commit."
            exit 1
          fi
          if [[ -z "$TAG_REF" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  npm:
    needs: validate
    name: Publish npm package
    environment: npm-publish
    if: github.repository == 'Protorip/registry-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1
        with:
          setup_only: true
          version: "1.50.0"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm codegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test-e2e
      - run: pnpm build
      - run: pnpm pack --dry-run
      - name: Publish @protorip/registry-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec changeset publish --no-git-tag

  docker:
    needs: [validate, npm]
    name: Publish Docker image
    if: github.repository == 'Protorip/registry-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/protorip/registry-server
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  draft-release:
    name: Draft GitHub release
    needs: [validate, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Draft release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## ${TAG#v}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "Missing changelog entry for $TAG."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$NOTES"
